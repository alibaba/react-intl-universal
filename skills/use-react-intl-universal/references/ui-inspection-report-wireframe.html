<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Inspection Report</title>
  <link rel="stylesheet" href="https://g.alicdn.com/code/lib/bootstrap/4.5.3/css/bootstrap.min.css" />
  <style>
    :root {
      color-scheme: light;
      --report-page: #eef2f6;
      --report-surface: #ffffff;
      --report-soft: #f7f9fc;
      --report-ink: #172033;
      --report-muted: #657289;
      --report-line: #d5dde8;
      --report-line-strong: #b9c5d4;
      --report-primary: #2457a7;
      --report-primary-soft: #edf3fc;
      --report-danger: #c73546;
      --report-warning: #9a6400;
      --report-success: #217a55;
      --report-shadow: 0 8px 24px rgba(30, 42, 62, 0.08);
      --report-overlay-shadow: 0 24px 72px rgba(8, 15, 29, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 1280px;
      margin: 0;
      background: var(--report-page);
      color: var(--report-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    body.report-overlay-open {
      overflow: hidden;
    }

    a {
      color: var(--report-primary);
      text-underline-offset: 3px;
    }

    a:hover {
      color: #173f80;
    }

    code,
    pre {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    code {
      padding: 1px 5px;
      border: 1px solid #dfe6ef;
      border-radius: 4px;
      background: #f5f7fa;
      color: #24324a;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .report-shell {
      width: 1220px;
      max-width: none;
      margin: 0 auto;
      padding: 28px 0 84px;
    }

    .report-main {
      width: 100%;
      min-width: 0;
    }

    .report-zero {
      margin-top: 0;
      padding: 38px 40px;
    }

    .report-zero h1 {
      margin: 0 0 7px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hero-card,
    .report-card,
    .finding-card,
    .evidence-card,
    .observation-card {
      border: 1px solid var(--report-line);
      border-radius: 8px;
      background: var(--report-surface);
      box-shadow: var(--report-shadow);
    }

    .hero-card {
      padding: 30px 32px 28px;
      border-top: 3px solid var(--report-primary);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 26px 48px;
      align-items: start;
    }

    .hero-card h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .hero-card p {
      max-width: 700px;
      margin: 10px 0 0;
      color: var(--report-muted);
    }

    .report-meta-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      margin: 0;
    }

    .report-meta-row > div {
      display: grid;
      grid-template-columns: 125px minmax(0, 1fr);
      gap: 18px;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid #e5eaf1;
    }

    .report-meta-row > div:first-child {
      padding-top: 0;
    }

    .report-meta-row > div:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .report-meta-row span,
    .finding-meta dt,
    .appendix-meta dt {
      color: var(--report-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .report-meta-row strong {
      min-width: 0;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .metric-strip {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 2px;
      border-top: 1px solid #e1e7ef;
    }

    .metric-card {
      min-width: 0;
      padding: 20px 26px 0 0;
    }

    .metric-card + .metric-card {
      padding-left: 26px;
      border-left: 1px solid #e1e7ef;
    }

    .metric-card span {
      color: var(--report-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-card strong {
      display: block;
      margin: 7px 0 5px;
      font-size: 34px;
      line-height: 1;
    }

    .metric-card small {
      color: var(--report-muted);
    }

    .metric-card[data-tone="danger"] strong {
      color: var(--report-danger);
    }

    .metric-card[data-tone="warning"] strong {
      color: var(--report-warning);
    }

    .metric-card[data-tone="success"] strong {
      color: var(--report-success);
    }

    .quick-nav {
      position: sticky;
      top: 10px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 14px;
      padding: 8px;
      border: 1px solid var(--report-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--report-shadow);
    }

    .quick-nav .nav-link {
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 5px;
      color: #35435a;
      font-weight: 600;
    }

    .quick-nav .nav-link:hover,
    .quick-nav .nav-link.active {
      background: var(--report-primary-soft);
      color: var(--report-primary);
      text-decoration: none;
    }

    section[id],
    article[id] {
      scroll-margin-top: 82px;
    }

    .report-card {
      margin-top: 20px;
      padding: 24px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e8edf3;
    }

    .section-head h2,
    .findings-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .section-head p {
      margin: 5px 0 0;
      color: var(--report-muted);
    }

    .feedback-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .copy-fallback {
      display: none;
      margin: 0 0 16px;
    }

    .copy-fallback.open {
      display: block;
    }

    .copy-fallback textarea {
      min-height: 110px;
      resize: vertical;
    }

    textarea[data-feedback-id] {
      min-height: 72px;
      resize: vertical;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--report-line);
      border-radius: 7px;
      background: var(--report-surface);
    }

    .table-wrap .table,
    .acceptance-table {
      margin-bottom: 0;
      color: var(--report-ink);
      font-size: 13px;
    }

    .table-wrap .table thead th,
    .acceptance-table thead th {
      border-top: 0;
      border-bottom: 1px solid var(--report-line-strong);
      background: #f0f3f7;
      color: #334057;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .table-wrap .table td,
    .table-wrap .table th,
    .acceptance-table td,
    .acceptance-table th {
      padding: 10px 11px;
      vertical-align: top;
    }

    .acceptance-table tbody th {
      width: 210px;
      color: #3d4a60;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: flex-start;
    }

    .badge-row .badge {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 5px 9px;
      border-radius: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .findings-title {
      margin: 28px 0 14px;
      font-size: 24px;
    }

    .finding-card {
      margin-bottom: 20px;
      overflow: visible;
    }

    .finding-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 500px);
      gap: 20px;
      align-items: start;
      padding: 19px 22px;
      border-bottom: 1px solid var(--report-line);
      border-radius: 8px 8px 0 0;
      background: #fafbfd;
    }

    .finding-head h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .finding-head p {
      margin: 4px 0 0;
      color: var(--report-muted);
    }

    .finding-head .badge-row {
      justify-content: flex-end;
    }

    .finding-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0;
      padding: 18px 22px;
      border-bottom: 1px solid var(--report-line);
    }

    .finding-meta > div {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #e0e6ee;
      border-radius: 6px;
      background: var(--report-soft);
    }

    .finding-meta dd {
      margin: 4px 0 0;
      overflow-wrap: anywhere;
    }

    .evidence-list,
    .shot-grid,
    .shot-grid-row,
    .observation-grid,
    .appendix-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .evidence-list,
    .shot-grid {
      padding: 20px 22px;
      border-bottom: 1px solid var(--report-line);
    }

    .finding-evidence-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-bottom: 1px solid var(--report-line);
      background: #f7f9fc;
    }

    .finding-evidence-column {
      min-width: 0;
      padding: 18px;
    }

    .finding-evidence-column + .finding-evidence-column {
      border-left: 1px solid var(--report-line);
    }

    .evidence-column-title {
      margin: 0 0 12px;
      color: #26334a;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .finding-evidence-stack {
      display: grid;
      gap: 14px;
    }

    .evidence-empty {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 1px dashed #cbd4e0;
      border-radius: 7px;
      background: var(--report-surface);
      color: var(--report-muted);
      text-align: center;
    }

    .evidence-card {
      min-width: 0;
      padding: 16px;
      box-shadow: none;
    }

    .finding-evidence-grid .evidence-card {
      padding: 13px;
      border-radius: 7px;
    }

    .evidence-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .annotated-shot {
      min-width: 0;
      margin: 0;
      overflow: visible;
      border: 1px solid var(--report-line);
      border-radius: 7px;
      background: var(--report-surface);
    }

    .shot-scroll {
      width: 100%;
      max-width: 100%;
      max-height: 640px;
      overflow-x: auto;
      overflow-y: auto;
      background: #e7ecf2;
      overscroll-behavior: contain;
    }

    .annotated-stage {
      position: relative;
      display: block;
      color: inherit;
      background: #e7ecf2;
    }

    a.annotated-stage {
      cursor: zoom-in;
    }

    .annotated-stage.with-image {
      width: max-content;
      min-height: 0;
      line-height: 0;
    }

    .real-shot {
      display: block;
      width: auto;
      max-width: none;
      height: auto;
    }

    .finding-evidence-grid .shot-scroll {
      max-height: none;
      overflow: hidden;
    }

    .finding-evidence-grid .annotated-stage.with-image {
      width: 100%;
      max-width: 100%;
    }

    .finding-evidence-grid .real-shot {
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    .lightbox-stage .annotated-stage.with-image {
      width: max-content;
      max-width: none;
    }

    .lightbox-stage .real-shot {
      width: auto;
      max-width: none;
      height: auto;
    }

    .redbox {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid var(--report-danger);
      border-radius: 3px;
      background: rgba(199, 53, 70, 0.06);
      pointer-events: none;
    }

    .redbox em,
    .redbox span {
      position: absolute;
      top: -26px;
      left: -2px;
      max-width: 360px;
      padding: 4px 7px;
      border-radius: 4px;
      background: #a92336;
      color: #ffffff;
      font-size: 12px;
      font-style: normal;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .redbox.label-inside em,
    .redbox.label-inside span {
      top: 3px;
      left: 3px;
    }

    .annotated-shot figcaption,
    .evidence-review,
    .appendix-meta {
      padding: 11px 13px;
      border-top: 1px solid #e5eaf1;
      background: var(--report-surface);
      color: var(--report-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .evidence-review {
      color: #344157;
    }

    .evidence-claims {
      margin-top: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
    }

    .evidence-claim {
      scroll-margin-top: 82px;
      background: var(--report-surface);
    }

    .evidence-claim + .evidence-claim {
      border-top: 1px solid #e2e8f0;
    }

    .evidence-claim-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 11px 0;
    }

    .evidence-claim-head h5 {
      margin: 0;
      color: #26334a;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .evidence-claim > p {
      margin: 0;
      padding: 8px 11px 11px;
      color: #344157;
      font-size: 13px;
      line-height: 1.5;
    }

    .evidence-claim .evidence-review {
      border-top: 1px solid #e8edf3;
      font-size: 12px;
    }

    .finding-body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 20px 22px 22px;
    }

    .finding-body > section,
    .risk-panel {
      min-width: 0;
      padding: 15px;
      border: 1px solid #dfe6ee;
      border-radius: 6px;
      background: var(--report-soft);
    }

    .finding-body h4,
    .risk-panel h4 {
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .finding-body p,
    .risk-panel p {
      margin: 0;
      color: #344157;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .risk-panel {
      border-left: 4px solid var(--report-warning);
      background: #fffbf1;
    }

    .fix-diff {
      margin: 14px 0;
      overflow: hidden;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #fff;
    }

    .fix-diff summary {
      padding: 10px 12px;
      cursor: pointer;
      color: #172033;
      font-size: 13px;
      font-weight: 700;
      background: #f5f7fa;
    }

    .fix-diff-toolbar {
      padding: 8px 12px;
      border-top: 1px solid #e3e8ef;
      border-bottom: 1px solid #e3e8ef;
      color: var(--report-muted);
      font-size: 12px;
    }

    .fix-diff pre {
      max-height: 420px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      color: #e6edf3;
      background: #0d1117;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
    }

    .fix-diff pre code {
      color: inherit;
      background: transparent;
      white-space: inherit;
    }

    .fix-diff-limit {
      padding: 9px 12px;
      border-top: 1px solid #e3e8ef;
      color: #704c00;
      background: #fff8e1;
      font-size: 12px;
    }

    .finding-acceptance {
      margin: 0 22px 22px;
    }

    .finding-acceptance h4 {
      margin: 0 0 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .observation-card {
      min-width: 0;
      overflow: visible;
      box-shadow: none;
    }

    .observation-card > header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--report-line);
      border-radius: 8px 8px 0 0;
      background: #fafbfd;
    }

    .observation-card > header h3 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 700;
    }

    .observation-card > div {
      padding: 18px;
    }

    .appendix-meta dl {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      gap: 6px 12px;
      margin: 0;
    }

    .appendix-meta dd {
      min-width: 0;
      margin: 0;
      color: #344157;
      overflow-wrap: anywhere;
    }

    .shot-time {
      display: block;
      margin-top: 4px;
      color: var(--report-muted);
      font-size: 12px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1060;
      display: none;
      padding: 32px;
      background: rgba(7, 13, 25, 0.9);
    }

    .lightbox.open {
      display: block;
    }

    .lightbox-inner {
      width: 100%;
      height: 100%;
    }

    .lightbox-stage {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid #536078;
      border-radius: 7px;
      background: #dfe5ec;
      box-shadow: var(--report-overlay-shadow);
      overscroll-behavior: contain;
    }

    .lightbox-close {
      position: fixed;
      top: 10px;
      right: 14px;
      z-index: 1062;
    }

    .finding-modal {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
      background: rgba(18, 27, 43, 0.72);
    }

    .finding-modal.open {
      display: flex;
    }

    .finding-modal-panel {
      width: 1180px;
      max-width: calc(100vw - 48px);
      max-height: calc(100vh - 48px);
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid var(--report-line-strong);
      border-radius: 8px;
      background: var(--report-surface);
      box-shadow: var(--report-overlay-shadow);
    }

    .finding-modal-toolbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--report-line);
      background: #fafbfd;
    }

    .finding-modal-toolbar strong {
      min-width: 0;
      overflow: hidden;
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .finding-modal-content {
      min-width: 0;
    }

    .finding-modal-content .finding-card {
      margin: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .backTop {
      position: fixed;
      top: 50%;
      right: 24px;
      z-index: 1040;
      display: none;
      width: 100px;
      transform: translateY(-50%);
      border-color: var(--report-line-strong);
      background: var(--report-surface);
      color: #344157;
      box-shadow: var(--report-shadow);
      font-weight: 600;
    }

    .backTop.show {
      display: block;
    }

    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible {
      outline: 2px solid rgba(36, 87, 167, 0.38);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="report-shell" id="top">
    <div class="report-main">
      <!-- UI_INSPECTION_REPORT_CONTENT_START -->
      <section class="report-card report-zero" role="status" aria-live="polite">
        <h1>UI Inspection Report</h1>
        <p class="mb-0 text-muted">No report data is available.</p>
      </section>
      <!-- UI_INSPECTION_REPORT_CONTENT_END -->
    </div>
  </main>

  <button class="btn btn-outline-secondary btn-sm backTop" id="backTop" type="button" aria-label="Back to top">Back to top</button>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Screenshot preview" tabindex="-1">
    <button class="btn btn-outline-light btn-sm lightbox-close" type="button">Close</button>
    <div class="lightbox-inner" id="lightboxInner"></div>
  </div>

  <div class="modal finding-modal" id="findingModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="findingModalTitle" tabindex="-1">
    <div class="finding-modal-panel" role="document">
      <div class="finding-modal-toolbar">
        <strong id="findingModalTitle">Finding detail</strong>
        <button class="btn btn-outline-secondary btn-sm finding-modal-close" type="button">Close</button>
      </div>
      <div class="finding-modal-content" id="findingModalContent"></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const lightbox = document.getElementById("lightbox");
      const lightboxInner = document.getElementById("lightboxInner");
      const lightboxClose = lightbox ? lightbox.querySelector(".lightbox-close") : null;
      const findingModal = document.getElementById("findingModal");
      const findingModalTitle = document.getElementById("findingModalTitle");
      const findingModalContent = document.getElementById("findingModalContent");
      const findingModalClose = findingModal ? findingModal.querySelector(".finding-modal-close") : null;
      const backTop = document.getElementById("backTop");
      let lastFindingTrigger = null;
      let lastPreviewTrigger = null;

      function feedbackInputs() {
        return Array.from(document.querySelectorAll("textarea[data-feedback-id]"));
      }

      function copyStatusNode(button) {
        let status = document.getElementById("copyStatus");
        if (!status && button && button.parentNode) {
          status = document.createElement("span");
          status.id = "copyStatus";
          status.className = "text-muted";
          status.setAttribute("aria-live", "polite");
          button.insertAdjacentElement("afterend", status);
        }
        return status;
      }

      function setCopyStatus(button, message) {
        const status = copyStatusNode(button);
        if (status) {
          status.textContent = message;
        }
      }

      function ensureCopyFallback(button) {
        let fallback = document.getElementById("copyFallback");
        let field = document.getElementById("copyFallbackText");
        if (fallback && field) {
          return { fallback, field };
        }

        const anchor = button ? button.closest(".feedback-actions") || button : null;
        const host = button ? button.closest(".report-card") || document.querySelector(".report-main") : null;
        if (!anchor || !host) {
          return { fallback: null, field: null };
        }

        fallback = document.createElement("div");
        fallback.id = "copyFallback";
        fallback.className = "alert alert-warning copy-fallback";
        fallback.setAttribute("aria-live", "polite");

        const label = document.createElement("label");
        label.setAttribute("for", "copyFallbackText");
        label.textContent = "Copy feedback manually";

        const message = document.createElement("p");
        message.className = "mb-2";
        message.textContent = "Clipboard access is unavailable. Select the text below and copy it.";

        field = document.createElement("textarea");
        field.id = "copyFallbackText";
        field.className = "form-control";
        field.readOnly = true;

        fallback.appendChild(label);
        fallback.appendChild(message);
        fallback.appendChild(field);
        anchor.insertAdjacentElement("afterend", fallback);
        return { fallback, field };
      }

      function hideCopyFallback() {
        const fallback = document.getElementById("copyFallback");
        const field = document.getElementById("copyFallbackText");
        if (fallback) {
          fallback.classList.remove("open");
        }
        if (field) {
          field.value = "";
        }
      }

      function showCopyFallback(button, text, count) {
        const controls = ensureCopyFallback(button);
        if (controls.field) {
          controls.field.value = text;
        }
        if (controls.fallback) {
          controls.fallback.classList.add("open");
        }
        if (controls.field) {
          controls.field.focus();
          controls.field.select();
        }
        setCopyStatus(button, "Clipboard unavailable. Generated " + count + " feedback item(s) for manual copy.");
      }

      async function copyFeedback(button) {
        hideCopyFallback();
        const copiedItems = feedbackInputs()
          .map((input) => ({
            id: input.dataset.feedbackId,
            text: input.value.trim()
          }))
          .filter((item) => item.id && item.text)
          .map((item) => "Finding " + item.id + ": " + item.text);

        if (!copiedItems.length) {
          setCopyStatus(button, "No feedback to copy.");
          return;
        }

        const text = copiedItems.join("\n\n");
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            setCopyStatus(button, "Copied " + copiedItems.length + " finding(s) with feedback.");
            return;
          } catch (error) {
            // Fall through to the visible manual-copy control.
          }
        }
        showCopyFallback(button, text, copiedItems.length);
      }

      function focusElement(element) {
        if (!element || typeof element.focus !== "function") {
          return;
        }
        try {
          element.focus({ preventScroll: true });
        } catch (error) {
          element.focus();
        }
      }

      function isPreviewOpen() {
        return Boolean(lightbox && lightbox.classList.contains("open"));
      }

      function isFindingModalOpen() {
        return Boolean(findingModal && findingModal.classList.contains("open"));
      }

      function syncOverlayState() {
        document.body.classList.toggle("report-overlay-open", isPreviewOpen() || isFindingModalOpen());
      }

      function previewSource(stageId, trigger) {
        const sourceById = stageId ? document.getElementById(stageId) : null;
        if (sourceById) {
          return sourceById;
        }
        if (!trigger) {
          return null;
        }
        return trigger.matches(".annotated-stage") ? trigger : trigger.closest(".annotated-stage");
      }

      function openPreview(stageId, trigger) {
        if (!lightbox || !lightboxInner) {
          return;
        }
        const source = previewSource(stageId, trigger);
        if (!source) {
          return;
        }

        const clone = source.cloneNode(true);
        clone.removeAttribute("id");
        clone.removeAttribute("href");
        clone.removeAttribute("data-preview-stage");
        clone.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
        clone.querySelectorAll("[data-preview-stage]").forEach((node) => node.removeAttribute("data-preview-stage"));

        const viewport = document.createElement("div");
        viewport.className = "lightbox-stage";
        viewport.appendChild(clone);
        lightboxInner.replaceChildren(viewport);
        lastPreviewTrigger = trigger || document.activeElement;
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
        syncOverlayState();
        focusElement(lightboxClose || lightbox);
      }

      function closePreview() {
        if (!lightbox || !lightboxInner || !isPreviewOpen()) {
          return;
        }
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxInner.replaceChildren();
        syncOverlayState();
        focusElement(isFindingModalOpen() ? findingModalClose || findingModal : lastPreviewTrigger);
      }

      function openFindingModal(findingId, trigger) {
        if (!findingId || !findingModal || !findingModalContent || !findingModalTitle) {
          return;
        }
        const source = document.getElementById(findingId);
        if (!source) {
          return;
        }

        const clone = source.cloneNode(true);
        clone.removeAttribute("id");
        clone.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
        const title = source.querySelector("[data-finding-title], h3, h2");
        findingModalTitle.textContent = title ? title.textContent.trim() : findingId;
        findingModalContent.replaceChildren(clone);
        lastFindingTrigger = trigger || document.activeElement;
        findingModal.classList.add("open");
        findingModal.setAttribute("aria-hidden", "false");
        syncOverlayState();
        focusElement(findingModalClose || findingModal);
      }

      function closeFindingModal() {
        if (!findingModal || !findingModalContent || !isFindingModalOpen()) {
          return;
        }
        findingModal.classList.remove("open");
        findingModal.setAttribute("aria-hidden", "true");
        findingModalContent.replaceChildren();
        syncOverlayState();
        focusElement(lastFindingTrigger);
      }

      function closeTopmostOverlay(event) {
        if (isPreviewOpen()) {
          event.preventDefault();
          event.stopPropagation();
          closePreview();
          return true;
        }
        if (isFindingModalOpen()) {
          event.preventDefault();
          event.stopPropagation();
          closeFindingModal();
          return true;
        }
        return false;
      }

      function navItems() {
        return Array.from(document.querySelectorAll(".quick-nav .nav-link[href^='#']"))
          .map((link) => ({ link, target: document.querySelector(link.getAttribute("href")) }))
          .filter((item) => item.target);
      }

      function updateActiveNav() {
        const items = navItems();
        let active = items[0] || null;
        items.forEach((item) => {
          if (item.target.getBoundingClientRect().top <= 120) {
            active = item;
          }
        });
        items.forEach((item) => {
          item.link.classList.toggle("active", Boolean(active && item.link === active.link));
        });
      }

      function scrollTopValue() {
        const scroller = document.scrollingElement || document.documentElement;
        return Math.max(window.pageYOffset || 0, scroller.scrollTop || 0, document.body.scrollTop || 0);
      }

      function updateBackTop() {
        if (backTop) {
          backTop.classList.toggle("show", scrollTopValue() > 160);
        }
        updateActiveNav();
      }

      function forceTop() {
        if (window.location.hash) {
          window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }
        window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        document.querySelectorAll(".shot-scroll, .finding-modal-panel, .lightbox-stage").forEach((container) => {
          container.scrollTop = 0;
          container.scrollLeft = 0;
        });
      }

      document.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target : null;
        if (!target) {
          return;
        }

        const copyButton = target.closest("#copyFeedback");
        if (copyButton) {
          event.preventDefault();
          copyFeedback(copyButton);
          return;
        }

        if (target.closest(".lightbox-close") || target === lightbox || target === lightboxInner) {
          event.preventDefault();
          closePreview();
          return;
        }

        if (target.closest(".finding-modal-close") || target === findingModal) {
          event.preventDefault();
          closeFindingModal();
          return;
        }

        const findingTarget = target.closest("[data-finding-modal]");
        if (findingTarget) {
          event.preventDefault();
          openFindingModal(findingTarget.getAttribute("data-finding-modal"), findingTarget);
          return;
        }

        const previewTarget = target.closest("[data-preview-stage]");
        if (previewTarget) {
          event.preventDefault();
          openPreview(previewTarget.getAttribute("data-preview-stage"), previewTarget);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !event.repeat) {
          closeTopmostOverlay(event);
        }
      }, true);

      if (backTop) {
        backTop.addEventListener("click", forceTop);
      }
      window.addEventListener("scroll", updateBackTop, { passive: true });
      window.addEventListener("hashchange", updateActiveNav);
      document.addEventListener("scroll", updateBackTop, true);

      updateBackTop();
    })();
  </script>
</body>
</html>
